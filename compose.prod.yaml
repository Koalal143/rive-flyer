name: rivegauche-prod

services:
  frontend:
    profiles: [local-frontend]
    ports: !reset []

  nginx:
    build: .
    restart: unless-stopped
    command: ["/bin/sh", "/opt/rivegauche/nginx/start.sh"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - acme-webroot:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/_nginx_health"]
      interval: 3s
      timeout: 2s
      retries: 5

  certbot:
    build: ./deploy/certbot
    profiles: [tls]
    restart: unless-stopped
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - acme-webroot:/var/www/certbot
      - letsencrypt:/etc/letsencrypt

  backend:
    restart: unless-stopped
    environment:
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in .env.prod}
      SURVEY_ADMIN_HTTPS_ONLY: "true"

  analytics-db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${ANALYTICS_DB_PASSWORD:?set ANALYTICS_DB_PASSWORD in .env.prod}
      ANALYTICS_READER_PASSWORD: ${ANALYTICS_READER_PASSWORD:?set ANALYTICS_READER_PASSWORD in .env.prod}

  grafana:
    restart: unless-stopped
    environment:
      ANALYTICS_READER_PASSWORD: ${ANALYTICS_READER_PASSWORD:?set ANALYTICS_READER_PASSWORD in .env.prod}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_BASIC_ENABLED: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env.prod}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${SITE_DOMAIN:-localhost}
      GF_SERVER_ROOT_URL: https://%(domain)s/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports: !override
      - "127.0.0.1:${GRAFANA_PORT:-3011}:3000"

volumes:
  acme-webroot:
  letsencrypt:
