server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(api/|admin/survey$) {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $backend backend:8000;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
